[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "inkling-mlx-vision"
version = "0.5.5"
description = "Native MLX Vision Tower, custom Metal SDPA/M4-Pro kernels, and Agent-IDE OpenAI server for LookAtMyQuant Inkling-2-Mini"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "qoder3", email = "4l2io7yqj@mozmail.com" }]
requires-python = ">=3.11"
keywords = ["mlx", "apple-silicon", "inkling-2", "vision", "vlm", "openai-server", "lookatmyquant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lookatmyquant>=0.3.0,<0.4",
    "mlx>=0.30.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/qoder3/inkling-mlx-vision"
Repository = "https://github.com/qoder3/inkling-mlx-vision"
Issues = "https://github.com/qoder3/inkling-mlx-vision/issues"

[project.scripts]
inkling-mlx-serve = "inkling_mlx_vision.server:main"
inkling-extract-vision = "inkling_mlx_vision.extract:main"
inkling-build-hybrid = "inkling_mlx_vision.accel:build_hybrid_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/inkling_mlx_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
