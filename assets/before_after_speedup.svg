<svg xmlns="http://www.w3.org/2000/svg" width="760" height="524" viewBox="0 0 760 524" role="img" aria-label="Before vs After Speedups on Apple M4 Pro 16-Core">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="stockBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="fastBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="523" rx="14" fill="url(#bg2)" stroke="#30363d" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="40" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="700">
    Stock lamq serve + MLX vs. inkling-mlx-vision (16-Core M4 Pro)
  </text>
  <text x="28" y="61" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">
    Lower bar = faster latency (each pair normalized to stock baseline = 100%, all custom Metal kernels lossless)
  </text>

  <!-- Legend -->
  <g transform="translate(28, 77)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">
    <rect x="0" y="0" width="11" height="11" rx="3" fill="url(#stockBar)"/>
    <text x="16" y="9.5" fill="#94a3b8">Stock lookatmyquant + MLX (baseline)</text>

    <rect x="250" y="0" width="11" height="11" rx="3" fill="url(#fastBar)"/>
    <text x="266" y="9.5" fill="#e2e8f0" font-weight="600">inkling-mlx-vision (custom Metal + Radix Top-P + O(N) KV)</text>
  </g>

  <!-- Bar area: x=244..604 (max width=360px), badge at x=626..732 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- Row 1: DSpark Drafter 128K SDPA (21.66ms -> 3.32ms, 15.3% -> 55px, 6.5x) -->
    <text x="230" y="128" text-anchor="end" fill="#e2e8f0" font-size="12.5" font-weight="600">DSpark Drafter 128K SDPA</text>
    <text x="230" y="142" text-anchor="end" fill="#64748b" font-size="10.5">GQA-12:1 Metal vs mx.fast.sdpa</text>
    <rect x="244" y="113" width="360" height="15" rx="4" fill="url(#stockBar)"/>
    <text x="596" y="124.5" text-anchor="end" fill="#f8fafc" font-size="10.5" font-weight="600">21.66 ms</text>
    <rect x="244" y="132" width="55" height="15" rx="4" fill="url(#fastBar)"/>
    <text x="307" y="143.5" fill="#34d399" font-size="11.5" font-weight="700">3.32 ms</text>
    <rect x="626" y="119" width="106" height="24" rx="12" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.6"/>
    <text x="679" y="135" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">6.5× faster</text>

    <!-- Row 2: Exact Top-P Verify 200K (2.36ms -> 0.42ms, 17.8% -> 64px, 5.7x) -->
    <text x="230" y="178" text-anchor="end" fill="#e2e8f0" font-size="12.5" font-weight="600">Exact 200K Top-P Verify</text>
    <text x="230" y="192" text-anchor="end" fill="#64748b" font-size="10.5">Radix Metal vs mx.argsort (T=8)</text>
    <rect x="244" y="163" width="360" height="15" rx="4" fill="url(#stockBar)"/>
    <text x="596" y="174.5" text-anchor="end" fill="#f8fafc" font-size="10.5" font-weight="600">2.36 ms</text>
    <rect x="244" y="182" width="64" height="15" rx="4" fill="url(#fastBar)"/>
    <text x="316" y="193.5" fill="#34d399" font-size="11.5" font-weight="700">0.42 ms</text>
    <rect x="626" y="169" width="106" height="24" rx="12" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.6"/>
    <text x="679" y="185" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">5.7× faster</text>

    <!-- Row 3: 32K FP8 T=8 Tree Verify (8.21ms -> 1.50ms, 18.3% -> 66px, 5.46x) -->
    <text x="230" y="228" text-anchor="end" fill="#e2e8f0" font-size="12.5" font-weight="600">32K FP8 Tree Verify SDPA</text>
    <text x="230" y="242" text-anchor="end" fill="#64748b" font-size="10.5">T=8 tree(4-3), 1 global visit</text>
    <rect x="244" y="213" width="360" height="15" rx="4" fill="url(#stockBar)"/>
    <text x="596" y="224.5" text-anchor="end" fill="#f8fafc" font-size="10.5" font-weight="600">8.21 ms</text>
    <rect x="244" y="232" width="66" height="15" rx="4" fill="url(#fastBar)"/>
    <text x="318" y="243.5" fill="#34d399" font-size="11.5" font-weight="700">1.50 ms</text>
    <rect x="626" y="219" width="106" height="24" rx="12" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.6"/>
    <text x="679" y="235" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">5.46× faster</text>

    <!-- Row 4: 64K FP8 T=8 Tree Verify (13.25ms -> 2.72ms, 20.5% -> 74px, 4.86x) -->
    <text x="230" y="278" text-anchor="end" fill="#e2e8f0" font-size="12.5" font-weight="600">64K FP8 Tree Verify SDPA</text>
    <text x="230" y="292" text-anchor="end" fill="#64748b" font-size="10.5">T=8 tree(4-3), saves 84 ms/step</text>
    <rect x="244" y="263" width="360" height="15" rx="4" fill="url(#stockBar)"/>
    <text x="596" y="274.5" text-anchor="end" fill="#f8fafc" font-size="10.5" font-weight="600">13.25 ms</text>
    <rect x="244" y="282" width="74" height="15" rx="4" fill="url(#fastBar)"/>
    <text x="326" y="293.5" fill="#34d399" font-size="11.5" font-weight="700">2.72 ms</text>
    <rect x="626" y="269" width="106" height="24" rx="12" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.6"/>
    <text x="679" y="285" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">4.86× faster</text>

    <!-- Row 5: 64K FP8 Prefill FA2 (73.81ms -> 48.07ms, 65.1% -> 234px, 1.54x) -->
    <text x="230" y="328" text-anchor="end" fill="#e2e8f0" font-size="12.5" font-weight="600">64K FP8 Prefill FlashAttn2</text>
    <text x="230" y="342" text-anchor="end" fill="#64748b" font-size="10.5">T=256 chunk, saves 206 ms/chunk</text>
    <rect x="244" y="313" width="360" height="15" rx="4" fill="url(#stockBar)"/>
    <text x="596" y="324.5" text-anchor="end" fill="#f8fafc" font-size="10.5" font-weight="600">73.81 ms</text>
    <rect x="244" y="332" width="234" height="15" rx="4" fill="url(#fastBar)"/>
    <text x="486" y="343.5" fill="#38bdf8" font-size="11.5" font-weight="700">48.07 ms</text>
    <rect x="626" y="319" width="106" height="24" rx="12" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.6"/>
    <text x="679" y="335" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="700">1.54× faster</text>

    <!-- Row 6: DenseStage Dequant M4 Pro 16c (1.07ms -> 0.56ms, 52.3% -> 188px, 1.90x) -->
    <text x="230" y="378" text-anchor="end" fill="#e2e8f0" font-size="12.5" font-weight="600">M4 Pro 16c Dense Dequant</text>
    <text x="230" y="392" text-anchor="end" fill="#64748b" font-size="10.5">ntg=48 vs stock 10-core ntg=10</text>
    <rect x="244" y="363" width="360" height="15" rx="4" fill="url(#stockBar)"/>
    <text x="596" y="374.5" text-anchor="end" fill="#f8fafc" font-size="10.5" font-weight="600">1.07 ms</text>
    <rect x="244" y="382" width="188" height="15" rx="4" fill="url(#fastBar)"/>
    <text x="440" y="393.5" fill="#38bdf8" font-size="11.5" font-weight="700">0.56 ms</text>
    <rect x="626" y="369" width="106" height="24" rx="12" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.6"/>
    <text x="679" y="385" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="700">1.90× faster</text>

    <!-- Row 7: New IDE Chat Startup (~60s -> ~2.5s, 4.2% -> 16px, ~24x) -->
    <text x="230" y="428" text-anchor="end" fill="#e2e8f0" font-size="12.5" font-weight="600">New IDE Chat Startup</text>
    <text x="230" y="442" text-anchor="end" fill="#64748b" font-size="10.5">~24K shared system + tools preamble</text>
    <rect x="244" y="413" width="360" height="15" rx="4" fill="url(#stockBar)"/>
    <text x="596" y="424.5" text-anchor="end" fill="#f8fafc" font-size="10.5" font-weight="600">~60 s</text>
    <rect x="244" y="432" width="16" height="15" rx="4" fill="url(#fastBar)"/>
    <text x="268" y="443.5" fill="#34d399" font-size="11.5" font-weight="700">~2.5 s</text>
    <rect x="626" y="419" width="106" height="24" rx="12" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.6"/>
    <text x="679" y="435" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">~24× faster</text>

    <!-- Row 8: 32K Global KV Reallocation (4.74s -> 0.04s, 0.8% -> 8px, 118x) -->
    <text x="230" y="478" text-anchor="end" fill="#e2e8f0" font-size="12.5" font-weight="600">32K Global KV Realloc Copies</text>
    <text x="230" y="492" text-anchor="end" fill="#64748b" font-size="10.5">Pre-reserved O(N) vs +256 O(N²)</text>
    <rect x="244" y="463" width="360" height="15" rx="4" fill="url(#stockBar)"/>
    <text x="596" y="474.5" text-anchor="end" fill="#f8fafc" font-size="10.5" font-weight="600">4.74 s</text>
    <rect x="244" y="482" width="8" height="15" rx="4" fill="url(#fastBar)"/>
    <text x="260" y="493.5" fill="#34d399" font-size="11.5" font-weight="700">0.04 s</text>
    <rect x="626" y="469" width="106" height="24" rx="12" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.6"/>
    <text x="679" y="485" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">118× faster</text>
  </g>
</svg>
